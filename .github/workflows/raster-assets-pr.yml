name: Validate raster asset migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.event.pull_request.head.ref == 'agent/raster-assets'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out demo branch
        uses: actions/checkout@v4
        with:
          ref: agent/raster-assets
          path: EpochGui_Demo
          fetch-depth: 0
          show-progress: false

      - name: Check out EpochGui migration branch
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochGui
          ref: agent/raster-assets
          path: EpochGui
          show-progress: false

      - name: Apply migration
        run: |
          python EpochGui_Demo/tools/apply_raster_assets_migration.py
          python EpochGui_Demo/tools/fix_demo_cmake_scan.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libx11-dev libgl1-mesa-dev

      - name: Configure
        id: configure
        continue-on-error: true
        run: >-
          cmake -S EpochGui_Demo -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEPOCHGUI_ROOT=${{ github.workspace }}/EpochGui
          -DBUILD_TESTING=ON
          > configure.log 2>&1

      - name: Upload configure diagnostics
        if: steps.configure.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: configure-log
          path: configure.log

      - name: Report configure failure
        if: steps.configure.outcome == 'failure'
        run: |
          cat configure.log
          exit 1

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit validated migration
        working-directory: EpochGui_Demo
        run: |
          rm -f .github/workflows/raster-assets-migration.yml
          rm -f .github/workflows/raster-assets-pr.yml
          rm -f tools/apply_raster_assets_migration.py
          rm -f tools/fix_demo_cmake_scan.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt README.md src/complete_demo_renderer.cpp .github/workflows tools
          git commit -m "Use EpochGui raster assets"
          git push origin HEAD:agent/raster-assets
