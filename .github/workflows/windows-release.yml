name: Cross-Platform OpenGL Build

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - VERSION
      - README.md
      - include/**
      - modules/**
      - src/**
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epochgui-rounded-corners-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 MSVC and release
    runs-on: windows-2022

    steps:
      - name: Check out rounded-corner demo
        uses: actions/checkout@v4

      - name: Check out EpochEngine
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochEngine
          ref: main
          path: EpochEngine

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DBUILD_TESTING=ON
          -DEPOCH_ENGINE_ROOT="${{ github.workspace }}/EpochEngine/Engine"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Validate geometry and SVG generation
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "VERSION must contain major.minor.patch"
          }

          $tag = "v$version"
          $stageName = "EpochGuiRoundedCorners-$tag-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $stageName
          $zip = Join-Path $env:GITHUB_WORKSPACE "$stageName.zip"
          $checksum = "$zip.sha256"

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $checksum -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null

          Copy-Item build/Release/EpochGuiRoundedCorners.exe $stage
          Copy-Item build/Release/epoch_gui_rounded_corners_demo.exe $stage
          Copy-Item README.md $stage

          & build/Release/epoch_gui_rounded_corners_demo.exe `
              (Join-Path $stage 'epochgui_rounded_corners_demo.svg')
          if ($LASTEXITCODE -ne 0) {
              throw "Packaged geometry validation failed with exit code $LASTEXITCODE"
          }

          @(
              "EpochGUI Rounded Corners $tag"
              "Commit: $env:GITHUB_SHA"
              "Platform: Windows x64"
              "Compiler: MSVC"
              "Renderer: OpenGL 3.2 core through Win32/WGL"
              "Third-party runtime dependencies: none"
          ) | Set-Content -Path (Join-Path $stage 'BUILD.txt') -Encoding utf8

          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content $checksum -Encoding ascii

          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_CHECKSUM=$checksum" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_CHECKSUM }}
          if-no-files-found: error

      - name: Publish or refresh GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows x64 OpenGL 3.2 core demo through native Win32/WGL. Dependency-free except EpochGUI; no third-party runtime DLLs. Linux GLX and macOS Cocoa builds run independently and cannot block this Windows release."

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:RELEASE_TAG $env:RELEASE_ZIP $env:RELEASE_CHECKSUM --clobber
              if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed" }
              gh release edit $env:RELEASE_TAG `
                  --target $env:GITHUB_SHA `
                  --title "EpochGUI Rounded Corners $env:RELEASE_TAG" `
                  --notes $notes
              if ($LASTEXITCODE -ne 0) { throw "Release metadata update failed" }
          }
          else {
              gh release create $env:RELEASE_TAG `
                  $env:RELEASE_ZIP `
                  $env:RELEASE_CHECKSUM `
                  --target $env:GITHUB_SHA `
                  --title "EpochGUI Rounded Corners $env:RELEASE_TAG" `
                  --notes $notes
              if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }

  linux:
    name: Linux x64 Clang 18
    runs-on: ubuntu-24.04

    steps:
      - name: Install native windowing dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libx11-dev libgl1-mesa-dev

      - name: Resolve preinstalled Clang module tools
        run: |
          set -euxo pipefail
          clang++-18 --version
          cmake --version
          ninja --version

          scanner="$(command -v clang-scan-deps-18 || true)"
          if [ -z "$scanner" ] && [ -x /usr/lib/llvm-18/bin/clang-scan-deps ]; then
            scanner=/usr/lib/llvm-18/bin/clang-scan-deps
          fi
          if [ -z "$scanner" ]; then
            echo "clang-scan-deps for Clang 18 was not found" >&2
            exit 1
          fi

          "$scanner" --version
          echo "CLANG_SCAN_DEPS=$scanner" >> "$GITHUB_ENV"

      - name: Check out rounded-corner demo
        uses: actions/checkout@v4

      - name: Check out EpochEngine
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochEngine
          ref: main
          path: EpochEngine

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS="${{ env.CLANG_SCAN_DEPS }}"
          -DBUILD_TESTING=ON
          -DEPOCH_ENGINE_ROOT="${{ github.workspace }}/EpochEngine/Engine"

      - name: Build
        run: cmake --build build --parallel --verbose

      - name: Validate geometry and SVG generation
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS arm64 LLVM Clang
    runs-on: macos-14

    steps:
      - name: Install LLVM and Ninja
        run: brew install llvm ninja

      - name: Check out rounded-corner demo
        uses: actions/checkout@v4

      - name: Check out EpochEngine
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochEngine
          ref: main
          path: EpochEngine

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_OBJCXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DEPOCH_ENGINE_ROOT="${{ github.workspace }}/EpochEngine/Engine"

      - name: Build
        run: cmake --build build --parallel

      - name: Validate geometry and SVG generation
        run: ctest --test-dir build --output-on-failure
