name: Cross-Platform OpenGL Build

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - VERSION
      - include/**
      - modules/**
      - src/**
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 MSVC
    runs-on: windows-2022

    steps:
      - name: Check out rounded-corner demo
        uses: actions/checkout@v4

      - name: Check out EpochEngine
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochEngine
          ref: main
          path: EpochEngine

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DBUILD_TESTING=ON
          -DEPOCH_ENGINE_ROOT="${{ github.workspace }}/EpochEngine/Engine"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Validate geometry and SVG generation
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "VERSION must contain major.minor.patch"
          }

          $tag = "v$version"
          $stageName = "EpochGuiRoundedCorners-$tag-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $stageName
          $zip = Join-Path $env:GITHUB_WORKSPACE "$stageName.zip"
          $checksum = "$zip.sha256"

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $checksum -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null

          Copy-Item build/Release/EpochGuiRoundedCorners.exe $stage
          Copy-Item build/Release/epoch_gui_rounded_corners_demo.exe $stage
          Copy-Item README.md $stage

          & build/Release/epoch_gui_rounded_corners_demo.exe `
              (Join-Path $stage 'epochgui_rounded_corners_demo.svg')
          if ($LASTEXITCODE -ne 0) {
              throw "Packaged geometry validation failed with exit code $LASTEXITCODE"
          }

          @(
              "EpochGUI Rounded Corners $tag"
              "Commit: $env:GITHUB_SHA"
              "Platform: Windows x64"
              "Compiler: MSVC"
              "Renderer: OpenGL 3.2 core through Win32/WGL"
              "Third-party runtime dependencies: none"
          ) | Set-Content -Path (Join-Path $stage 'BUILD.txt') -Encoding utf8

          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content $checksum -Encoding ascii

          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_CHECKSUM=$checksum" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_CHECKSUM }}
          if-no-files-found: error

  linux:
    name: Linux x64 Clang
    runs-on: ubuntu-24.04

    steps:
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libx11-dev libgl1-mesa-dev

      - name: Check out rounded-corner demo
        uses: actions/checkout@v4

      - name: Check out EpochEngine
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochEngine
          ref: main
          path: EpochEngine

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DEPOCH_ENGINE_ROOT="${{ github.workspace }}/EpochEngine/Engine"

      - name: Build
        run: cmake --build build --parallel

      - name: Validate geometry and SVG generation
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS arm64 AppleClang
    runs-on: macos-14

    steps:
      - name: Install Ninja
        run: brew install ninja

      - name: Check out rounded-corner demo
        uses: actions/checkout@v4

      - name: Check out EpochEngine
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochEngine
          ref: main
          path: EpochEngine

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_OBJCXX_COMPILER=clang++
          -DEPOCH_ENGINE_ROOT="${{ github.workspace }}/EpochEngine/Engine"

      - name: Build
        run: cmake --build build --parallel

      - name: Validate geometry and SVG generation
        run: ctest --test-dir build --output-on-failure

  release:
    name: Publish Windows release
    needs:
      - windows
      - linux
      - macos
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Publish or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          zip="$(find release-assets -maxdepth 1 -name '*.zip' -print -quit)"
          checksum="$(find release-assets -maxdepth 1 -name '*.sha256' -print -quit)"

          test -n "$zip"
          test -n "$checksum"

          notes="Cross-platform C++23 EpochGUI rounded-corner demo. The Windows asset uses OpenGL 3.2 core through native Win32/WGL with no third-party runtime dependencies. The same source is build-verified through X11/GLX on Linux and Cocoa/OpenGL on macOS."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" "$checksum" --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "EpochGUI Rounded Corners $tag" --notes "$notes"
          else
            gh release create "$tag" "$zip" "$checksum" --target "$GITHUB_SHA" --title "EpochGUI Rounded Corners $tag" --notes "$notes"
          fi
