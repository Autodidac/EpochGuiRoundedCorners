name: Windows Release

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - VERSION
      - README.md
      - include/**
      - modules/**
      - src/**
      - tests/**
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epochgui-rounded-corners-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 MSVC
    runs-on: windows-2022

    steps:
      - name: Check out rounded-corner demo
        uses: actions/checkout@v4

      - name: Check out EpochEngine
        uses: actions/checkout@v4
        with:
          repository: Autodidac/EpochEngine
          ref: main
          path: EpochEngine

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DBUILD_TESTING=ON
          -DEPOCH_ENGINE_ROOT="${{ github.workspace }}/EpochEngine/Engine"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run geometry contract test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare single executable
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw 'VERSION must contain major.minor.patch'
          }

          $source = Join-Path $env:GITHUB_WORKSPACE 'build\Release\EpochGuiRoundedCorners.exe'
          if (-not (Test-Path $source)) {
              throw "Expected application was not built: $source"
          }

          $assetName = "EpochGuiRoundedCorners-v$version-windows-x64.exe"
          $asset = Join-Path $env:GITHUB_WORKSPACE $assetName
          $checksum = "$asset.sha256"

          Copy-Item $source $asset -Force

          $allExecutables = @(Get-ChildItem $env:GITHUB_WORKSPACE -Filter 'EpochGuiRoundedCorners-v*-windows-x64.exe' -File)
          if ($allExecutables.Count -ne 1) {
              throw 'Release staging must contain exactly one user-facing executable.'
          }

          $versionInfo = (Get-Item $asset).VersionInfo
          if ($versionInfo.ProductName -ne 'EpochGUI Rounded Corners') {
              throw 'Windows product metadata is missing or incorrect.'
          }

          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content $checksum -Encoding ascii

          "RELEASE_TAG=v$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_EXE=$asset" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_CHECKSUM=$checksum" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ env.RELEASE_EXE }}
            ${{ env.RELEASE_CHECKSUM }}
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows x64 OpenGL 3.2 core demo using native Win32/WGL.

          This release contains exactly one application executable. The geometry validator is CI-only and is not distributed.
          "@

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:RELEASE_TAG $env:RELEASE_EXE $env:RELEASE_CHECKSUM --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
              gh release edit $env:RELEASE_TAG `
                  --target $env:GITHUB_SHA `
                  --title "EpochGUI Rounded Corners $env:RELEASE_TAG" `
                  --notes $notes
              if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
          }
          else {
              gh release create $env:RELEASE_TAG `
                  $env:RELEASE_EXE `
                  $env:RELEASE_CHECKSUM `
                  --target $env:GITHUB_SHA `
                  --title "EpochGUI Rounded Corners $env:RELEASE_TAG" `
                  --notes $notes
              if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
